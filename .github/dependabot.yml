version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
